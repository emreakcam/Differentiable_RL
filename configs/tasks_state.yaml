# ═══════════════════════════════════════════════════════════════════════════
# Robosuite STATE-Primitive Configuration
# ═══════════════════════════════════════════════════════════════════════════
# The state-observation counterpart to configs/tasks.yaml.  Same robot, same
# primitive vocabulary, same tasks, same rewards — the ONE difference is what
# the policy sees:
#
#     tasks.yaml        camera → DINOv3 patches → spatial softmax → trunk
#     tasks_state.yaml  exact object coordinates from the simulator → trunk
#
# There is no camera, no renderer and no backbone in this pipeline, so an
# episode is a single pure-JAX BPTT scan instead of a chunked render/physics
# interleave.
#
# Loaded by envs/state_registry.py:load_state_config().  Point elsewhere with
# the MJX_STATE_TASK_CONFIG environment variable or the trainer's --config flag.
#
# This is a full copy rather than an overlay on tasks.yaml on purpose: the two
# branches are free to diverge in architecture, learning rates and gradient
# clips without either one dragging the other along.


# ═══════════════════════════════════════════════════════════════════════════
# ROBOT — shared by every task, because the trunk is shared
# ═══════════════════════════════════════════════════════════════════════════
robot:
  n_joints: 7

  # ee(3) + vel(3) + finger(1) + q(7) + qdot(7) + ee_quat(4) = 25.
  # Identical to the vision pipeline's 25-dim prefix; what follows differs.
  proprio_prefix_dim: 25

  # The full observation: the 25-dim proprio prefix followed by obs.n_slots
  # object slots of obs.slot_dim each.  25 + 6*3 = 43.  One trunk and one
  # ObsRMS consume this for every task, so it must be a constant — which is
  # exactly why the slots are a fixed, zero-padded array rather than a
  # per-task-sized vector.  Validated against obs: in load_state_config().
  proprio_dim: 43

  q_lo:        [-2.897, -1.763, -2.897, -3.072, -2.897, -0.018, -2.897]
  q_hi:        [ 2.897,  1.763,  2.897, -0.070,  2.897,  3.752,  2.897]
  vel_limits:  [2.17, 2.17, 2.17, 2.17, 2.61, 2.61, 2.61]

  # Uniform ±noise added to the arm's home qpos at every reset.
  joint_reset_noise: 0.2

  # Robosuite two-actuator gripper: ctrl[7] = +f, ctrl[8] = -f.
  # Opening width is read back as qpos[7] - qpos[8].
  gripper:
    ctrl_pos_idx: 7
    ctrl_neg_idx: 8
    qpos_pos_idx: 7
    qpos_neg_idx: 8

  ee_site:   gripper0_right_grip_site
  hand_body: robot0_right_hand


# ═══════════════════════════════════════════════════════════════════════════
# OBSERVATION — the fixed-width object-slot array
# ═══════════════════════════════════════════════════════════════════════════
# Every task declares a `state_slots:` list naming what it wants the policy to
# know exactly.  Each entry becomes one slot_dim-wide block of the observation,
# and unused slots are zero-filled, so all tasks agree on a single width and the
# shared trunk plus the shared per-primitive heads work exactly as they do in
# the vision pipeline.
#
# Slot kinds:
#   {body:  <name>}   the body's world position          state.xpos[id]
#   {site:  <name>}   the site's world position          state.site_xpos[id]
#   {mocap: <name>}   the mocap body's position          state.mocap_pos[id]
#   {joint: <name>}   [q, joint_target, joint_target-q]  state.qpos[adr]
#
# The `joint` kind is the one slot that is not literally a position: an
# articulated task's progress is a scalar joint coordinate, and its handle site
# (a separate slot) already gives the exact location.  Packing the joint value,
# its target and the remaining travel into one slot keeps the array uniform.
# `joint_target` is read from the task's own key of that name.
#
# n_slots is 6 while the hungriest tasks (container, peg_insertion) use 4: the
# spare slots cost 6 always-zero observation dims but leave room for a new task
# without changing the observation width, which would invalidate every existing
# checkpoint.
obs:
  n_slots:  6
  slot_dim: 3

  # Floor under ObsRMS's per-dimension variance.  The padded slots are constant
  # zero and a slot used by only one task is constant zero for every other, so
  # without a floor those dims normalise as 0/1e-8 and any numerical dust in
  # them is amplified by 1e8.  helpers/state_obs.py applies it.
  var_floor: 1.0e-4


# ═══════════════════════════════════════════════════════════════════════════
# PHYSICS — shared solver settings
# ═══════════════════════════════════════════════════════════════════════════
physics:
  solver_iterations:    6
  solver_ls_iterations: 8

# Nothing in the state pipeline renders. These two blocks are retained only
# because envs/base.py reads them while constructing an environment, and the
# state envs inherit that constructor. Editing them changes nothing.
camera:
  name: robot0_eye_in_hand
  count: 1

render_fields: []


# ═══════════════════════════════════════════════════════════════════════════
# PRIMITIVE VOCABULARY
# ═══════════════════════════════════════════════════════════════════════════
# One head per entry, keyed by name rather than by positional segment index,
# so every task's `reach` drives the same `reach` head.  Order fixes the head
# order in the parameter tree — appending is safe, reordering invalidates
# existing checkpoints.
#
# finger_bias feeds head_forward's sigmoid: f = sigmoid(b4[7]) * FINGER_OPEN.
#   +2.0 → ~0.035 m (open)      -2.0 → ~0.005 m (closed on an object)
primitives:
  reach:       {finger_bias:  2.0, doc: approach with the gripper open}
  descend:     {finger_bias:  2.0, doc: still open while descending onto the object}
  grasp:       {finger_bias: -2.0, doc: close on the object}
  move:        {finger_bias: -2.0, doc: carry, same closure as grasp}
  release:     {finger_bias:  2.0, doc: open to drop}
  align:       {finger_bias: -2.0, doc: hold the peg over the hole}
  insert:      {finger_bias: -2.0, doc: still holding while pushing down}
  pull_drawer: {finger_bias: -2.0, doc: pull a drawer open by the handle}
  push_drawer: {finger_bias: -2.0, doc: push the drawer shut by the handle}
  push_object: {finger_bias: -2.0, doc: closed fist makes a solid pushing face}
  slide_open:  {finger_bias: -2.0, doc: slide a window sash open}
  slide_close: {finger_bias: -2.0, doc: slide a window sash shut}
  turn:        {finger_bias: -2.0, doc: rotate a dial}
  swing:       {finger_bias: -2.0, doc: swing a hinged door}


# ═══════════════════════════════════════════════════════════════════════════
# APPROACH GEOMETRY — one constant, applied to whatever target a task tracks
# ═══════════════════════════════════════════════════════════════════════════
# `reach` aims pre_grasp_z above its task's target and `descend` aims descend_z
# above it; `grasp` always aims at the target itself. Applies only to tasks
# staged reach -> descend -> grasp; a task that goes straight reach -> grasp
# aims at its target directly.
approach:
  pre_grasp_z: 0.1
  descend_z:   0.0


# ═══════════════════════════════════════════════════════════════════════════
# POLICY ARCHITECTURE
# ═══════════════════════════════════════════════════════════════════════════
# No proj_dim and no spatial softmax here — there are no patches to project.
# The observation goes straight into the trunk, so the trunk's input is
# robot.proprio_dim (43) rather than 2*proj_dim + proprio.
#
# The trunk is deliberately left at the vision pipeline's width even though its
# input is ~10x narrower: what the trunk has to represent is the task, not the
# observation, and every primitive head reads from it.
policy:
  trunk_hidden: 256    #384

  # Each head's width scales with how much work it does: a head driven by many
  # segments across the task set carries far more of the behaviour than one
  # driven by a single segment.
  #   hidden = max(floor, per_segment x <segments driving this head>)
  # Counted over EVERY task in this file, not the --tasks subset, so the
  # architecture does not change with the task selection.
  head_hidden:
    per_segment: 16    
    floor:       32    #64

  # Depth rather than width: measured head rank never passed 35% of width, and
  # width did not predict rank among heads of equal workload, so widening buys
  # little. The widths above are halved against the single-layer values they
  # replace (commented inline) — the capacity moves into depth rather than
  # being added on top, which is the same trade configs/tasks.yaml makes.
  head_layers: 2


# ═══════════════════════════════════════════════════════════════════════════
# TRAINING DEFAULTS — every one is overridable on the command line
# ═══════════════════════════════════════════════════════════════════════════
training:
  default_tasks: [window_open, drawer_open, cube_stacking]

  batch:        20
  substeps:     4
  iters:        1000
  gamma:        0.999

  # Unused by this pipeline (nothing is rendered and the episode is not split
  # into render chunks). Kept because envs/base.py's constructor reads them.
  img_size:     64
  chunk_size:   5

  # Gradient clipping — the shared trunk and every primitive head are clipped
  # independently, because they see very different gradient magnitudes. A head
  # driven by 13 segments accumulates a far larger raw gradient than one driven
  # by a single segment; under one shared threshold the most-shared head is
  # clipped hardest, which is the opposite of what you want.
  #
  # These start at the vision pipeline's values. They are NOT measured for the
  # state observation — with no projection or spatial softmax between the
  # observation and the trunk, the trunk's gradient in particular is a different
  # quantity. Tune them from the per-head |g| table a run prints: a head whose
  # clip factor sits near 1.00 is unclipped and its limit is not binding; one
  # pinned near 0.10 is discarding 90% of every step and wants a higher limit.
  grad_clip: 1500.0          # shared trunk
  grad_clip_head:
    reach:       3000.0
    descend:     1500.0
    grasp:       1000.0
    move:        1000.0
    release:     500.0
    align:       500.0
    insert:      500.0
    pull_drawer: 1000.0
    push_drawer: 1000.0
    push_object: 500.0
    slide_open:  1000.0
    slide_close: 1000.0
    turn:        1500.0
    swing:       2000.0

  grad_groups:  1
  log_every:    5
  warmup_iters: 2
  save_every:   50     # checkpoint params + ObsRMS + reward plot this often
  # A single non-finite iteration is skipped and training continues; this
  # many CONSECUTIVE ones means the problem is structural, not one bad batch.
  max_nan_skips: 10
  # Divide each task's loss by its active_steps before summing, so a task at
  # phase 0 weighs as much as one at its final phase. Off by default: it
  # changes the objective, not just its scale.
  normalise_loss: false

  lr:      2.0e-4      # shared trunk
  lr_head: 2.0e-4      # per-primitive heads

  # The insertion primitives want a smaller step: the tight peg fit makes their
  # gradients larger and spikier than the approach ones.
  lr_prim:
    align:  2.0e-5
    insert: 2.0e-5

  curriculum:
    patience:   2        # curriculum ticks before a phase advances
    pass_frac:  0.50     # fraction of envs that must meet a phase's criterion

  termination:
    success_rate:   0.8  # per-tick success needed to extend the streak
    success_streak: 4    # consecutive qualifying logs before a task is solved


# ═══════════════════════════════════════════════════════════════════════════
# TASKS
# ═══════════════════════════════════════════════════════════════════════════
# env         → the class in envs/ that implements this task; envs/state_tasks.py
#               maps each name onto the state variant of that class
# xml         → asset path, relative to assets/
# seg_steps   → frames per segment
# prim_seq    → which primitive head drives each segment (same length)
# criteria    → per-segment curriculum test: [kind, threshold]
#                 dist  → pass when the metric is BELOW the threshold
#                 lift  → pass when the metric is ABOVE the threshold
#                 angle → pass when the metric is ABOVE the threshold
#                 always→ always passes
# state_slots → what this task feeds the policy exactly (see the `obs:` block)
# retired     → runnable by name, but excluded from `--tasks all`
tasks:

  # ── free-space reach ────────────────────────────────────────────────────
  reach:
    env: reach
    xml: robosuite_reach.xml
    seg_steps:  [35]
    seg_labels: [Reach]
    prim_seq:   [reach]
    criteria:   [[dist, success]]
    success_thresh: 0.03           # |ee - target| for an env to count as solved
    target_quat: [0.0000, 0.9999, 0.0012, 0.0173]
    mocap_body:    reach_target
    target_center: [0.0, 0.0, 0.90]
    target_range:  [0.15, 0.15, 0.05]
    # The vision pipeline already fed this target in as coordinates (a 2.5 cm
    # marker is too small to localise on a 4x4 patch grid), so `reach` is the
    # one task the two branches observe identically.
    state_slots:
      - {mocap: reach_target}

  # ── stack one cube on another ───────────────────────────────────────────
  cube_stacking:
    env: cube_stacking
    xml: robosuite_stack.xml
    seg_steps:  [25, 20, 10, 35, 10]
    seg_labels: [Reach, Descend, Grasp, Move, Release]
    prim_seq:   [reach, descend, grasp, move, release]
    criteria:
      - [dist, 0.06]
      - [dist, 0.04]
      - [dist, 0.04]
      - [dist, 0.10]
      - [always, 0]
    target_quat: [0.0000, 0.9999, 0.0012, 0.0173]
    cube2_height:  0.05
    stack_offset:  0.01
    cube_qpos_idx: 9               # free-joint x offset; y is +1
    cube_xy_noise: 0.05
    success_xy_tol: 0.02           # cube1 within this of cube2 in xy = stacked
    # box  = the cube being carried, box2 = the base cube it stacks onto.
    state_slots:
      - {body: box}
      - {body: box2}

  # ── pick a cube and carry it to a marker (no release) ───────────────────
  pick_and_place:
    env: pick_place
    xml: robosuite_pick_place_push.xml
    seg_steps:  [25, 20, 10, 35]
    seg_labels: [Reach, Descend, Grasp, Move]
    prim_seq:   [reach, descend, grasp, move]
    criteria:
      - [dist, 0.04]
      - [dist, 0.04]
      - [dist, 0.04]
      - [dist, success]
    success_thresh: 0.03           # |cube - place target|, measured while held
    target_quat: [0.0000, 0.9999, 0.0012, 0.0173]
    cube_qpos_idx: 9
    cube_xy_noise: 0.05
    mocap_body:    place_target
    place_center: [0.0, 0.0, 0.90]
    place_range:  [0.15, 0.15, 0.05]
    state_slots:
      - {body: box}
      - {mocap: place_target}

  # ── push a cube along the table to a marker (non-prehensile) ────────────
  push_cube:
    env: push_cube
    xml: robosuite_pick_place_push.xml
    retired: true                  # hard non-prehensile problem; excluded from 'all'
    seg_steps:  [25, 35]
    seg_labels: [Reach, Push]
    prim_seq:   [reach, push_object]
    criteria:
      - [dist, 0.05]
      - [dist, success]
    success_thresh: 0.05           # |cube - goal|
    target_quat: [0.0000, 0.9999, 0.0012, 0.0173]
    cube_qpos_idx: 9
    cube_xy_noise: 0.05
    push_standoff: 0.06
    push_offset:   0.01
    mocap_body:   place_target
    goal_center:  [0.12, 0.0, 0.825]
    goal_range:   [0.06, 0.15, 0.0]
    # The standoff point the reach aims at is a function of both, and the policy
    # now has the exact inputs to that function rather than having to see them.
    state_slots:
      - {body: box}
      - {mocap: place_target}

  # ── drop three objects into a container ─────────────────────────────────
  container:
    env: container
    xml: robosuite_container.xml
    retired: true    # 15 segments
    prim_seq: [reach, descend, grasp, move, release,
               reach, descend, grasp, move, release,
               reach, descend, grasp, move, release]
    target_quat: [0.0000, 0.9999, 0.0012, 0.0173]
    place_z_offset: 0.15           # drop height above the container_inside site
    container_site: container_inside
    container_radius: 0.125        # xy radius counting as "in the container"
    table_z: 0.80                  # an object below this has left the table
    obj_xy_noise: 0.03
    per_object:
      objects:        [ball, prism, cube]
      label_prefixes: [B, P, C]
      qpos_idx:       {ball: 16, prism: 23, cube: 9}
      seg_steps:  [25, 20, 10, 25, 10]
      seg_labels: [Reach, Desc, Grasp, Move, Rel]
      criteria:
        - [dist, 0.05]
        - [dist, 0.05]
        - [dist, 0.04]
        - [dist, 0.10]
        - [always, 0]
    # Object order matches `per_object.objects`, so slot i is the object the
    # i-th group of five segments works on.
    state_slots:
      - {body: ball}
      - {body: prism}
      - {body: cube}
      - {site: container_inside}

  # ── seat a peg in a slot ────────────────────────────────────────────────
  peg_insertion:
    env: peg_insertion
    xml: robosuite_peg.xml
    retired: true    # contact-rich
    seg_steps:  [25, 20, 10, 25, 20, 20, 10]
    seg_labels: [Reach, Descend, Grasp, Move, Align, Insert, Release]
    prim_seq:   [reach, descend, grasp, move, align, insert, release]
    criteria:
      - [dist, 0.05]
      - [dist, 0.05]
      - [dist, 0.04]
      - [dist, 0.10]
      - [dist, 0.03]
      - [dist, 0.03]
      - [always, 0]
    success_thresh: 0.03           # |peg tip - slot floor|
    target_quat: [0.0000, 0.9999, 0.0012, 0.0173]
    peg_qpos_idx: 9
    peg_xy_noise: 0.03
    sites:
      peg_body:    peg
      peg_bottom:  peg_bottom
      peg_grip:    peg_grip
      slot_entry:  slot_entry
      slot_target: slot_target
    # peg_grip and peg_bottom are two points on the same rigid body, so their
    # difference gives the peg's tilt — which is what align and insert actually
    # need, and the reason positions alone are enough here.
    state_slots:
      - {site: peg_grip}
      - {site: peg_bottom}
      - {site: slot_entry}
      - {site: slot_target}

  # ── articulated tasks ───────────────────────────────────────────────────
  # One hinge or slide joint driven by its handle. Two slots each: where the
  # handle is right now, and how far the joint still has to travel.
  drawer_open:
    env: articulated
    xml: robosuite_drawer.xml
    seg_steps:  [35, 10, 35]
    seg_labels: [Reach, Grasp, Pull]
    prim_seq:   [reach, grasp, pull_drawer]
    criteria:
      - [dist, 0.03]
      - [dist, 0.03]
      - [dist, success]
    success_thresh: 0.02           # |joint - target|
    target_quat: [0.2554, 0.6594, 0.6593, 0.2555]
    joint:       drawer_slide
    handle_site: drawer_handle_site
    joint_target: -0.16
    joint_init_range: [-0.02,  0.00]
    state_slots:
      - {site: drawer_handle_site}
      - {joint: drawer_slide}

  drawer_close:
    env: articulated
    xml: robosuite_drawer.xml
    seg_steps:  [35, 10, 35]
    seg_labels: [Reach, Grasp, Push]
    prim_seq:   [reach, grasp, push_drawer]
    criteria:
      - [dist, 0.03]
      - [dist, 0.03]
      - [dist, success]
    success_thresh: 0.02
    target_quat: [0.2554, 0.6594, 0.6593, 0.2555]
    joint:       drawer_slide
    keyframe:    home2   # starts at the far end of travel
    handle_site: drawer_handle_site
    joint_target: 0.0
    joint_init_range: [-0.16, -0.14]
    state_slots:
      - {site: drawer_handle_site}
      - {joint: drawer_slide}

  window_open:
    env: articulated
    xml: robosuite_window.xml
    seg_steps:  [35, 10, 35]
    seg_labels: [Reach, Grasp, Slide]
    prim_seq:   [reach, grasp, slide_open]
    criteria:
      - [dist, 0.03]
      - [dist, 0.03]
      - [dist, success]
    success_thresh: 0.02
    target_quat: [-0.0118, 0.9494, -0.0360, 0.3119]
    joint:       window_slide
    handle_site: window_handle_site
    joint_target: 0.2
    joint_init_range: [ 0.00,  0.05]
    state_slots:
      - {site: window_handle_site}
      - {joint: window_slide}

  window_close:
    env: articulated
    xml: robosuite_window.xml
    seg_steps:  [35, 10, 35]
    seg_labels: [Reach, Grasp, Slide]
    prim_seq:   [reach, grasp, slide_close]
    criteria:
      - [dist, 0.03]
      - [dist, 0.03]
      - [dist, success]
    success_thresh: 0.02
    target_quat: [-0.0118, 0.9494, -0.0360, 0.3119]
    joint:       window_slide
    keyframe:    home2   # starts at the far end of travel
    handle_site: window_handle_site
    joint_target: 0.0
    joint_init_range: [ 0.15,  0.20]
    state_slots:
      - {site: window_handle_site}
      - {joint: window_slide}

  dial_turn:
    env: articulated
    xml: robosuite_dial.xml
    seg_steps:  [35, 20, 10, 50]
    seg_labels: [Reach, Descend, Grasp, Turn]
    prim_seq:   [reach, descend, grasp, turn]
    criteria:
      - [dist, 0.03]
      - [dist, 0.03]
      - [dist, 0.03]
      - [dist, success]
    success_thresh: 0.2            # radians
    target_quat: [0.0, 0.7071068, 0.7071068, 0.0]
    joint:       dial_rotate
    handle_site: dial_grip_site
    joint_target: 1.57             # quarter turn, positive direction
    joint_init_range: [-0.10,  0.10]
    state_slots:
      - {site: dial_grip_site}
      - {joint: dial_rotate}

  door_open:
    env: articulated
    xml: robosuite_door.xml
    seg_steps:  [35, 10, 65]
    seg_labels: [Reach, Grasp, Swing]
    prim_seq:   [reach, grasp, swing]
    criteria:
      - [dist, 0.03]
      - [dist, 0.03]
      - [dist, success]
    success_thresh: 0.1
    target_quat: [0.2554, 0.6594, 0.6593, 0.2555]
    joint:       doorjoint
    handle_site: door_handle_site
    joint_target: -0.70             # open ~70% of range
    joint_init_range: [-0.10,  0.00]
    state_slots:
      - {site: door_handle_site}
      - {joint: doorjoint}
